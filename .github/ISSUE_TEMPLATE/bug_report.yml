name: Bug 报告 (Bug report)
description: 提交可复现的 Bug，建议附带日志或截图以便定位。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量填写以下信息以帮助定位问题；日志类或纯代码 Bug 无需强制附截图。

        提交前请先搜索确认没有重复：[搜索现有 Issue](https://github.com/ningbainb/deepseek-harness-desktop/issues?q=is%3Aissue)
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: 提交前查重
      description: 提交前请先搜索确认没有重复的 Issue。
      options:
        - label: 我已搜索过 open/closed 的 Issue，确认本 Issue 没有重复。
          required: true
  - type: dropdown
    id: plugin
    attributes:
      label: 涉及插件
      description: 选择问题涉及的插件或区域。
      options:
        - 桌面端本体 / 安装与更新 (dsh-desktop)
        - 性价比模式 (dsh-value-mode)
        - 智能操控 / 浏览器操控 (control-center)
        - 任务看板 (dsh-task-board)
        - Git 图谱 (dsh-git-graph)
        - 右侧面板 (dsh-aionui-panel)
        - 远程 Web UI (dsh-remote-web-ui)
        - SSH 远程运维 (dsh-ssh)
        - 实时令牌统计 (dsh-live-stats)
        - 宠物 (dsh-pet)
        - 皮肤 / 皮肤中心 (dsh-skins)
        - 聚合包 / 安装 (dsh-web-ui-all / dsh-web-ui-settings)
        - 其他 / 不确定
    validations:
      required: true
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue 类型
      description: 本表单仅用于可复现的 Bug；功能请求请使用另一个表单。
      options:
        - Bug 报告
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      description: 用一两句话描述 Bug。
      placeholder: 出了什么问题？
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: 预期结果
      description: 描述应该发生什么。
      placeholder: 你期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: details-reproduction
    attributes:
      label: 详情 / 复现步骤
      description: 给出清晰的复现步骤。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: DSH 版本、浏览器、插件名称与版本、操作系统及关键配置。
      placeholder: |
        - DSH 版本:
        - 浏览器:
        - 插件名称 / 版本:
        - 操作系统:
    validations:
      required: true
  - type: textarea
    id: bug-screenshot
    attributes:
      label: Bug 截图
      description: 建议粘贴或上传展示界面异常的截图（纯逻辑、配置或日志报错可留空）。
      placeholder: 将图片拖到此处，或粘贴 GitHub 图片 / 文件链接。
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 如有日志、链接或其他上下文，请补充。
    validations:
      required: false
