name: Issue Template Helper

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  enforce:
    name: Gently request missing details without closing technical issues
    runs-on: ubuntu-latest

    steps:
      - name: Validate issue template
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (issue.pull_request) {
              return;
            }

            const requiredSections = [
              '涉及插件',
              'Issue 类型',
              '摘要',
              '预期结果',
              '详情 / 复现步骤',
              '环境信息',
            ];

            const body = issue.body || '';
            const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const readSection = (label) => {
              const heading = escapeRegExp(label);
              const pattern = new RegExp(`(?:^|\\n)###\\s+${heading}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s+|$)`, 'i');
              const match = body.match(pattern);
              return match ? match[1].replace(/<!--[\s\S]*?-->/g, '').trim() : '';
            };

            const isBlank = (value) => {
              const normalized = value.replace(/\s+/g, ' ').trim().toLowerCase();
              return normalized === '' || normalized === 'no response' || normalized === '_no response_';
            };

            const hasTechnicalEvidence = (text) => {
              const trimmed = text.trim();
              if (trimmed.length < 240) return false;
              return /```[\s\S]+?```/.test(trimmed)
                || /(?:Error:|Exception|TypeError|SyntaxError|EACCES|ENOENT|at\s+\S+:\d+)/i.test(trimmed);
            };

            const missingSections = requiredSections.filter((label) => isBlank(readSection(label)));
            if (missingSections.length === 0 || hasTechnicalEvidence(body)) {
              return;
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-info'],
              });
            } catch {
              // Best-effort labeling even if repository permissions restrict label creation.
            }

            const comment = [
              '感谢反馈！为了让维护者更快定位问题，建议补充以下模板信息（不会自动关闭您的 Issue）：',
              '',
              `待补充部分：${missingSections.join(', ')}`,
              '',
              '如果是运行报错或故障排查，也欢迎直接贴出相关日志片段、版本号和系统环境。',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment,
            });