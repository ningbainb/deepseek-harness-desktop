name: Desktop Three-Platform Release

on:
  workflow_dispatch:
  push:
    tags:
      - desktop-v*

permissions:
  contents: read

concurrency:
  group: desktop-three-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: meta
        run: node scripts/desktop-release-metadata.mjs

  windows:
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      REQUIRE_SIGNING: 'false'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DSH_DESKTOP_UPDATE_CHANNEL: stable
      DSH_DESKTOP_SETTINGS_SCREENSHOTS: ${{ github.workspace }}/.tmp/release-qa/native-settings
      DSH_DESKTOP_DOCK_SCREENSHOTS: ${{ github.workspace }}/.tmp/release-qa/dock
      DSH_DESKTOP_BETA_SCREENSHOTS: ${{ github.workspace }}/.tmp/release-qa/usability
      DSH_DESKTOP_E2E_RECEIPT: ${{ github.workspace }}/.tmp/release-qa/source-core.json
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @linxin666/dsh-desktop exec playwright install chromium
      - name: Prepare confined native Windows fixture storage
        shell: pwsh
        run: node apps/dsh-desktop/scripts/prepare-native-fixture-storage.mjs
      - name: Check native installer cancellation before full verification
        run: node --test apps/dsh-desktop/test/installer-hardening-native.test.mjs
      - run: pnpm verify
      - run: pnpm feature-baseline:check
      - run: pnpm desktop:regression:e2e --source --collect-failures
      - name: Configure anonymous product metrics
        shell: pwsh
        env:
          DSH_TELEMETRY_ENDPOINT: ${{ vars.DSH_TELEMETRY_ENDPOINT }}
        run: |
          $endpoint = [Uri]::new(([string]$env:DSH_TELEMETRY_ENDPOINT).Trim())
          if ($endpoint.Scheme -ne 'https' -or $endpoint.AbsolutePath -ne '/v1/events' -or $endpoint.Query -or $endpoint.Fragment -or $endpoint.UserInfo) {
            throw 'DSH_TELEMETRY_ENDPOINT must be a credential-free HTTPS URL ending exactly in /v1/events.'
          }
          @{ endpoint = $endpoint.AbsoluteUri; officialBuild = $true } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM apps/dsh-desktop/build/telemetry-config.json
      - run: pnpm --filter @linxin666/dsh-desktop pack:win
      - name: Verify production Setup on the disposable Windows Runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:DSH_DESKTOP_PREVIOUS_RELEASE_VERSION = '4.3.0'
          $env:DSH_DESKTOP_PREVIOUS_RELEASE_DIRECTORY = Join-Path $env:RUNNER_TEMP 'dsh-previous-release-4.3.0'
          $env:DSH_DESKTOP_SETUP_RECEIPT = Join-Path $env:GITHUB_WORKSPACE '.tmp/release-qa/setup-from-4.3.0.json'
          New-Item -ItemType Directory -Path $env:DSH_DESKTOP_PREVIOUS_RELEASE_DIRECTORY -Force | Out-Null
          gh release download desktop-v4.3.0 --repo ningbainb/deepseek-harness-desktop --pattern 'DeepSeek-Harness-Desktop-Setup-4.3.0-x64.exe' --pattern SHA256SUMS.txt --dir $env:DSH_DESKTOP_PREVIOUS_RELEASE_DIRECTORY
          node apps/dsh-desktop/scripts/verify-release-installer.mjs
          $env:DSH_DESKTOP_PREVIOUS_RELEASE_VERSION = '5.0.0'
          $env:DSH_DESKTOP_PREVIOUS_RELEASE_DIRECTORY = Join-Path $env:RUNNER_TEMP 'dsh-previous-release-5.0.0'
          $env:DSH_DESKTOP_SETUP_RECEIPT = Join-Path $env:GITHUB_WORKSPACE '.tmp/release-qa/setup-from-5.0.0.json'
          New-Item -ItemType Directory -Path $env:DSH_DESKTOP_PREVIOUS_RELEASE_DIRECTORY -Force | Out-Null
          gh release download desktop-v5.0.0 --repo ningbainb/deepseek-harness-desktop --pattern 'DeepSeek-Harness-Desktop-Setup-5.0.0-x64.exe' --pattern SHA256SUMS.txt --dir $env:DSH_DESKTOP_PREVIOUS_RELEASE_DIRECTORY
          node apps/dsh-desktop/scripts/verify-release-installer.mjs
          $env:DSH_DESKTOP_PREVIOUS_RELEASE_VERSION = '5.0.1'
          $env:DSH_DESKTOP_PREVIOUS_RELEASE_DIRECTORY = Join-Path $env:RUNNER_TEMP 'dsh-previous-release-5.0.1'
          $env:DSH_DESKTOP_SETUP_RECEIPT = Join-Path $env:GITHUB_WORKSPACE '.tmp/release-qa/setup-from-5.0.1.json'
          New-Item -ItemType Directory -Path $env:DSH_DESKTOP_PREVIOUS_RELEASE_DIRECTORY -Force | Out-Null
          gh release download desktop-v5.0.1 --repo ningbainb/deepseek-harness-desktop --pattern 'DeepSeek-Harness-Desktop-Setup-5.0.1-x64.exe' --pattern SHA256SUMS.txt --dir $env:DSH_DESKTOP_PREVIOUS_RELEASE_DIRECTORY
          node apps/dsh-desktop/scripts/verify-release-installer.mjs
          $env:DSH_DESKTOP_PREVIOUS_RELEASE_VERSION = '5.1.0'
          $env:DSH_DESKTOP_PREVIOUS_RELEASE_DIRECTORY = Join-Path $env:RUNNER_TEMP 'dsh-previous-release-5.1.0'
          $env:DSH_DESKTOP_SETUP_RECEIPT = Join-Path $env:GITHUB_WORKSPACE '.tmp/release-qa/setup-from-5.1.0.json'
          New-Item -ItemType Directory -Path $env:DSH_DESKTOP_PREVIOUS_RELEASE_DIRECTORY -Force | Out-Null
          gh release download desktop-v5.1.0 --repo ningbainb/deepseek-harness-desktop --pattern 'DeepSeek-Harness-Desktop-Setup-5.1.0-x64.exe' --pattern SHA256SUMS.txt --dir $env:DSH_DESKTOP_PREVIOUS_RELEASE_DIRECTORY
          node apps/dsh-desktop/scripts/verify-release-installer.mjs
      - name: Run packaged Windows regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:DSH_DESKTOP_E2E_EXECUTABLE = (Resolve-Path 'apps/dsh-desktop/dist/win-unpacked/DeepSeek Harness Desktop.exe').Path
          pnpm --filter @linxin666/dsh-desktop test:direct-start-matrix:e2e
          pnpm --filter @linxin666/dsh-desktop test:fresh-relaunch:e2e
          pnpm --filter @linxin666/dsh-desktop test:directory-picker:e2e
          pnpm --filter @linxin666/dsh-desktop test:terminal:e2e
          pnpm --filter @linxin666/dsh-desktop test:window-chrome:e2e
          pnpm --filter @linxin666/dsh-desktop test:profile-reset:e2e
          pnpm --filter @linxin666/dsh-desktop test:update-shutdown:e2e
          $env:DSH_DESKTOP_E2E_RECEIPT = Join-Path $env:GITHUB_WORKSPACE '.tmp/release-qa/packaged-full.json'
          pnpm --filter @linxin666/dsh-desktop test:regression:e2e:full --collect-failures
      - run: pnpm --filter @linxin666/dsh-desktop pack:verify
      - run: pnpm --filter @linxin666/dsh-desktop pack:smoke
      - run: pnpm --filter @linxin666/dsh-desktop release:signatures:verify
      - run: pnpm --filter @linxin666/dsh-desktop release:manifest:verify
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ needs.metadata.outputs.version }}-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/dsh-desktop/dist/DeepSeek-Harness-Desktop-Setup-*.exe
            apps/dsh-desktop/dist/DeepSeek-Harness-Desktop-Setup-*.exe.blockmap
            apps/dsh-desktop/dist/latest.yml
            apps/dsh-desktop/dist/SHA256SUMS.txt
            apps/dsh-desktop/dist/release-manifest.json

      - name: Preserve Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-qa-${{ needs.metadata.outputs.version }}-windows-x64
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: .tmp/release-qa/**

      - name: Preserve native source and companion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-native-qa-${{ needs.metadata.outputs.version }}-windows-x64
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            ${{ runner.temp }}/dsh-native-fixtures/dsh-release-plugins-results/**
            ${{ runner.temp }}/dsh-native-fixtures/dsh-sidebar-footer-results/**
            ${{ runner.temp }}/dsh-native-fixtures/dsh-pet-clearance-results-*/**
            ${{ runner.temp }}/dsh-native-fixtures/dsh-packaged-release-browser-results/**
            ${{ runner.temp }}/dsh-native-fixtures/dsh-dafeiyu-clearance-results-*/**

      - name: Preserve failed Windows candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-debug-${{ needs.metadata.outputs.version }}-windows-x64
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            .tmp/release-qa/**
            .tmp/interaction-qa/**
            apps/dsh-desktop/dist/DeepSeek-Harness-Desktop-Setup-*.exe
            apps/dsh-desktop/dist/SHA256SUMS.txt
            apps/dsh-desktop/dist/release-manifest.json

  macos:
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 120
    env:
      REQUIRE_SIGNING: 'false'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DSH_DESKTOP_UPDATE_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4
      - run: test "$(uname -m)" = arm64
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @linxin666/dsh-desktop exec playwright install chromium
      - run: pnpm verify
      - run: pnpm feature-baseline:check
      - name: Configure anonymous product metrics
        env:
          DSH_TELEMETRY_ENDPOINT: ${{ vars.DSH_TELEMETRY_ENDPOINT }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          const endpoint = new URL(process.env.DSH_TELEMETRY_ENDPOINT)
          if (endpoint.protocol !== 'https:' || endpoint.pathname !== '/v1/events' || endpoint.search || endpoint.hash || endpoint.username || endpoint.password) throw new Error('Invalid telemetry endpoint')
          await writeFile('apps/dsh-desktop/build/telemetry-config.json', JSON.stringify({ endpoint: endpoint.href, officialBuild: true }, null, 2) + '\n')
          NODE
      - run: pnpm --filter @linxin666/dsh-desktop pack:mac
      - run: pnpm --filter @linxin666/dsh-desktop pack:verify:mac
      - run: pnpm --filter @linxin666/dsh-desktop pack:smoke:mac
      - name: Verify unsigned Preview and checksums
        working-directory: apps/dsh-desktop/dist
        run: |
          set -euo pipefail
          if codesign -dv --verbose=4 'mac-arm64/DeepSeek Harness Desktop.app' 2>&1 | grep -q '^Authority=Developer ID Application'; then exit 1; fi
          shasum -a 256 DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-arm64.dmg DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-arm64.zip > SHA256SUMS-macos.txt
          shasum -a 256 -c SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ needs.metadata.outputs.version }}-macos-arm64-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/dsh-desktop/dist/DeepSeek-Harness-Desktop-*-arm64.dmg
            apps/dsh-desktop/dist/DeepSeek-Harness-Desktop-*-arm64.zip
            apps/dsh-desktop/dist/SHA256SUMS-macos.txt

  linux:
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      REQUIRE_SIGNING: 'false'
      DSH_DESKTOP_UPDATE_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4
      - run: test "$(uname -m)" = x86_64
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @linxin666/dsh-desktop exec playwright install chromium
      - run: pnpm verify
      - run: pnpm feature-baseline:check
      - name: Configure anonymous product metrics
        env:
          DSH_TELEMETRY_ENDPOINT: ${{ vars.DSH_TELEMETRY_ENDPOINT }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          const endpoint = new URL(process.env.DSH_TELEMETRY_ENDPOINT)
          if (endpoint.protocol !== 'https:' || endpoint.pathname !== '/v1/events' || endpoint.search || endpoint.hash || endpoint.username || endpoint.password) throw new Error('Invalid telemetry endpoint')
          await writeFile('apps/dsh-desktop/build/telemetry-config.json', JSON.stringify({ endpoint: endpoint.href, officialBuild: true }, null, 2) + '\n')
          NODE
      - run: pnpm --filter @linxin666/dsh-desktop pack:linux
      - run: pnpm --filter @linxin666/dsh-desktop pack:verify:linux
      - run: pnpm --filter @linxin666/dsh-desktop pack:sandbox:linux
      - name: Run packaged Linux smoke
        run: |
          sudo chown root:root apps/dsh-desktop/dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 apps/dsh-desktop/dist/linux-unpacked/chrome-sandbox
          xvfb-run -a pnpm --filter @linxin666/dsh-desktop pack:smoke:linux
      - name: Verify archives and checksums
        working-directory: apps/dsh-desktop/dist
        run: |
          set -euo pipefail
          chmod +x DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-x86_64.AppImage
          ./DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-x86_64.AppImage --appimage-extract AppRun >/dev/null
          test -x squashfs-root/AppRun
          dpkg-deb --info DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-amd64.deb >/dev/null
          sha256sum DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-x86_64.AppImage DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-amd64.deb > SHA256SUMS-linux.txt
          sha256sum -c SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ needs.metadata.outputs.version }}-linux-x64-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/dsh-desktop/dist/DeepSeek-Harness-Desktop-*-x86_64.AppImage
            apps/dsh-desktop/dist/DeepSeek-Harness-Desktop-*-amd64.deb
            apps/dsh-desktop/dist/SHA256SUMS-linux.txt

  verify-artifacts:
    needs: [metadata, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DSH_DESKTOP_VERSION: ${{ needs.metadata.outputs.version }}
      DSH_DESKTOP_PUBLISH: ${{ needs.metadata.outputs.publish }}
      DSH_DESKTOP_NATIVE_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-${{ needs.metadata.outputs.version }}-*
          path: preflight-assets
          merge-multiple: true
      - name: Verify native artifacts and write QA receipt
        working-directory: preflight-assets
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { createReadStream } from 'node:fs'
          import { copyFile, readFile, stat, writeFile } from 'node:fs/promises'
          import { finalizeThreePlatformReceipts } from '../scripts/finalize-three-platform-receipts.mjs'

          const version = process.env.DSH_DESKTOP_VERSION
          const results = JSON.parse(process.env.DSH_DESKTOP_NATIVE_RESULTS)
          const nativeJobs = {}
          for (const platform of ['windows', 'macos', 'linux']) {
            assert.equal(results[platform]?.result, 'success', `${platform}: native job must succeed`)
            nativeJobs[platform] = results[platform].result
          }
          const names = [
            `DeepSeek-Harness-Desktop-Setup-${version}-x64.exe`,
            `DeepSeek-Harness-Desktop-${version}-arm64.dmg`,
            `DeepSeek-Harness-Desktop-${version}-arm64.zip`,
            `DeepSeek-Harness-Desktop-${version}-x86_64.AppImage`,
            `DeepSeek-Harness-Desktop-${version}-amd64.deb`,
          ]
          const hash = bytes => createHash('sha256').update(bytes).digest('hex')
          const files = []
          for (const file of names) {
            const info = await stat(file)
            assert.ok(info.isFile() && info.size > 0, `${file}: native installation asset must be a nonempty file`)
            const digest = createHash('sha256')
            for await (const chunk of createReadStream(file)) digest.update(chunk)
            files.push({ file, size: info.size, sha256: digest.digest('hex') })
          }
          const nativeReceipts = []
          for (const [file, expected] of [
            ['SHA256SUMS.txt', names.slice(0, 1)],
            ['SHA256SUMS-macos.txt', names.slice(1, 3)],
            ['SHA256SUMS-linux.txt', names.slice(3, 5)],
          ]) {
            const bytes = await readFile(file)
            const rows = bytes.toString('utf8').trimEnd().split(/\r?\n/u)
            assert.equal(rows.length, expected.length, `${file}: native checksum entry count mismatch`)
            const seen = new Set()
            for (const row of rows) {
              const match = /^([a-f0-9]{64})\s+\*?(.+)$/iu.exec(row)
              assert.ok(match && expected.includes(match[2]), `${file}: unexpected native checksum entry`)
              assert.equal(seen.has(match[2]), false, `${file}: duplicate native checksum entry`)
              seen.add(match[2])
              assert.equal(match[1].toLowerCase(), files.find(asset => asset.file === match[2]).sha256, `${match[2]}: native checksum mismatch`)
            }
            nativeReceipts.push({ file: file === 'SHA256SUMS.txt' ? 'SHA256SUMS-windows.txt' : file, size: bytes.length, sha256: hash(bytes) })
          }
          await copyFile('SHA256SUMS.txt', 'SHA256SUMS-windows.txt')
          const combined = Buffer.from(files.map(({ file, sha256 }) => `${sha256}  ${file}\n`).join(''))
          await writeFile('SHA256SUMS.txt', combined)
          await finalizeThreePlatformReceipts('.', version)
          const manifest = await readFile('release-manifest.json')
          const receipt = {
            schemaVersion: 1, kind: 'desktop-three-platform-preflight', status: 'passed', version,
            sourceCommit: process.env.GITHUB_SHA, eventName: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            publish: process.env.DSH_DESKTOP_PUBLISH === 'true', nativeJobs, files, nativeReceipts,
            combinedChecksums: { file: 'SHA256SUMS.txt', size: combined.length, sha256: hash(combined) },
            releaseManifest: { file: 'release-manifest.json', size: manifest.length, sha256: hash(manifest) },
          }
          await writeFile('preflight-receipt.json', JSON.stringify(receipt, null, 2) + '\n')
          console.log(JSON.stringify(receipt, null, 2))
          NODE
      - name: Preserve three-platform preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-qa-${{ needs.metadata.outputs.version }}-three-platform
          if-no-files-found: error
          retention-days: 14
          path: |
            preflight-assets/preflight-receipt.json
            preflight-assets/SHA256SUMS-windows.txt
            preflight-assets/SHA256SUMS-macos.txt
            preflight-assets/SHA256SUMS-linux.txt
            preflight-assets/SHA256SUMS.txt
            preflight-assets/release-manifest.json

  publish:
    needs: [metadata, windows, macos, linux, verify-artifacts]
    if: github.event_name == 'push' && needs.metadata.outputs.publish == 'true' && needs.verify-artifacts.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-${{ needs.metadata.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete asset set and write combined checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          test -f DeepSeek-Harness-Desktop-Setup-${{ needs.metadata.outputs.version }}-x64.exe
          test -f DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-arm64.dmg
          test -f DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-arm64.zip
          test -f DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-x86_64.AppImage
          test -f DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-amd64.deb
          sha256sum -c SHA256SUMS.txt
          sha256sum -c SHA256SUMS-macos.txt
          sha256sum -c SHA256SUMS-linux.txt
          cp SHA256SUMS.txt SHA256SUMS-windows.txt
          sha256sum DeepSeek-Harness-Desktop-Setup-${{ needs.metadata.outputs.version }}-x64.exe DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-arm64.dmg DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-arm64.zip DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-x86_64.AppImage DeepSeek-Harness-Desktop-${{ needs.metadata.outputs.version }}-amd64.deb > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Bind public manifest to the combined checksum receipt
        run: node scripts/finalize-three-platform-receipts.mjs release-assets ${{ needs.metadata.outputs.version }}
      - uses: softprops/action-gh-release@v2
        with:
          name: DeepSeek Harness Desktop ${{ needs.metadata.outputs.version }}
          body_path: docs/launch/release-notes.md
          prerelease: false
          overwrite_files: false
          files: release-assets/*
