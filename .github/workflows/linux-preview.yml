name: Linux x64 Preview

on:
  workflow_dispatch:
  push:
    branches:
      - codex/linux-preview-4.0
    paths:
      - '.github/workflows/linux-preview.yml'
      - 'apps/dsh-desktop/**'
      - 'packages/**'
      - 'shared/**'
      - 'scripts/feature-baseline.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: linux-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      REQUIRE_SIGNING: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Verify Linux x64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          uname -a
          . /etc/os-release
          printf '%s %s\n' "$NAME" "$VERSION_ID"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify source and Linux packaging contracts
        run: |
          pnpm feature-baseline:check
          pnpm typecheck
          node --test \
            apps/dsh-desktop/test/electron-builder-linux.test.mjs \
            apps/dsh-desktop/test/distribution-artifacts.test.mjs \
            apps/dsh-desktop/test/package-linux.test.mjs \
            apps/dsh-desktop/test/verify-package-linux.test.mjs \
            apps/dsh-desktop/test/after-pack-linux.test.mjs \
            apps/dsh-desktop/test/unsigned-mac-preview.test.mjs \
            apps/dsh-desktop/test/terminal-session.test.mjs \
            apps/dsh-desktop/test/runtime-controller.test.mjs
      - name: Configure official anonymous product metrics
        shell: bash
        env:
          DSH_TELEMETRY_ENDPOINT: ${{ vars.DSH_TELEMETRY_ENDPOINT }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'

          const endpointText = process.env.DSH_TELEMETRY_ENDPOINT?.trim()
          if (!endpointText) throw new Error('Repository variable DSH_TELEMETRY_ENDPOINT is required')
          const endpoint = new URL(endpointText)
          if (endpoint.protocol !== 'https:'
            || endpoint.pathname !== '/v1/events'
            || endpoint.search !== ''
            || endpoint.hash !== ''
            || endpoint.username !== ''
            || endpoint.password !== '') {
            throw new Error('DSH_TELEMETRY_ENDPOINT must be a credential-free HTTPS URL ending exactly in /v1/events')
          }
          await writeFile(
            'apps/dsh-desktop/build/telemetry-config.json',
            `${JSON.stringify({ endpoint: endpoint.href, officialBuild: true }, null, 2)}\n`,
          )
          NODE
      - name: Build the Linux x64 deb installer
        run: pnpm --filter @linxin666/dsh-desktop pack:linux
      - name: Verify browser component with the packaged Electron carrier
        env:
          DSH_BROWSER_COMPONENT_CARRIER: ${{ github.workspace }}/apps/dsh-desktop/dist/linux-unpacked/deepseek-harness-desktop
        run: node --test apps/dsh-desktop/test/browser-component.test.mjs apps/dsh-desktop/test/runtime-browser-component.test.mjs
      - name: Verify rc3 market and opt-in prompt compatibility
        run: node --test apps/dsh-desktop/test/market-team-compat.test.mjs apps/dsh-desktop/test/market-team-runtime.test.mjs apps/dsh-desktop/test/market-team-entry-identity.test.mjs apps/dsh-desktop/test/sidebar-team-compat.test.mjs apps/dsh-desktop/test/sidebar-team-entry-identity.test.mjs apps/dsh-desktop/test/prompt-customizer-feature.test.mjs apps/dsh-desktop/test/skill-market-activation.test.mjs
      - name: Verify the single installer and deb updater payload
        run: node apps/dsh-desktop/scripts/verify-distribution-artifacts.mjs linux
      - name: Verify packaged Linux runtime
        run: pnpm --filter @linxin666/dsh-desktop pack:verify:linux
      - name: Verify bundled Office preview conversion and recalculation
        run: node apps/dsh-desktop/scripts/verify-office-runtime.mjs --resources apps/dsh-desktop/dist/linux-unpacked/resources --output apps/dsh-desktop/dist/office-runtime-verification
      - name: Verify packaged Landlock enforcement
        run: pnpm --filter @linxin666/dsh-desktop pack:sandbox:linux
      - name: Run packaged Electron smoke under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sandbox=apps/dsh-desktop/dist/linux-unpacked/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%U:%G %a' "$sandbox")" = 'root:root 4755'
          xvfb-run -a pnpm --filter @linxin666/dsh-desktop pack:smoke:linux
      - name: Validate Linux archives and write checksums
        shell: bash
        working-directory: apps/dsh-desktop/dist
        run: |
          set -euo pipefail
          version="$(node -p "require('../package.json').version")"
          deb="DeepSeek-Harness-Desktop-${version}-amd64.deb"
          dpkg-deb --info "$deb" >/dev/null
          dpkg-deb --contents "$deb" > deb-contents.txt
          grep -q 'deepseek-harness-desktop' deb-contents.txt
          rm deb-contents.txt
          inspection="$(mktemp -d "$RUNNER_TEMP/dsh-deb-inspect.XXXXXX")"
          dpkg-deb --extract "$deb" "$inspection"
          mapfile -d '' types < <(find "$inspection" -type f -path '*/resources/package-type' -print0)
          test "${#types[@]}" = 1
          test "$(cat "${types[0]}")" = deb
          sha256sum "$deb" > SHA256SUMS-linux.txt
          sha256sum -c SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-linux-x64-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/dsh-desktop/dist/DeepSeek-Harness-Desktop-*-amd64.deb
            apps/dsh-desktop/dist/SHA256SUMS-linux.txt
            apps/dsh-desktop/dist/distribution-artifacts-linux-x64.json
            apps/dsh-desktop/dist/runtime-prune-report.json
            apps/dsh-desktop/dist/office-runtime-verification/report.json

  validate-ubuntu24:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REQUIRE_SIGNING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify Ubuntu 24 x64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$VERSION_ID" = 24.04
          uname -a
          printf '%s %s\n' "$NAME" "$VERSION_ID"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-linux-x64-preview
          path: apps/dsh-desktop/dist
      - name: Verify the candidate commit and installer bytes
        shell: bash
        working-directory: apps/dsh-desktop/dist
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS-linux.txt
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { createReadStream } from 'node:fs'
          import { readFile, stat } from 'node:fs/promises'
          const receipt = JSON.parse(await readFile('distribution-artifacts-linux-x64.json', 'utf8'))
          const manifest = JSON.parse(await readFile('../package.json', 'utf8'))
          assert.equal(receipt.sourceCommit, process.env.GITHUB_SHA)
          assert.equal(receipt.version, manifest.version)
          assert.equal(receipt.platform, 'linux')
          assert.equal(receipt.arch, 'x64')
          const expected = `DeepSeek-Harness-Desktop-${manifest.version}-amd64.deb`
          assert.deepEqual(receipt.files.map(artifact => artifact.file), [expected])
          const artifact = receipt.files[0]
          assert.equal(artifact.role, 'user-installer')
          assert.equal((await stat(expected)).size, artifact.size)
          const digest = createHash('sha256')
          for await (const chunk of createReadStream(expected)) digest.update(chunk)
          assert.equal(digest.digest('hex'), artifact.sha256)
          console.log(`Verified the Ubuntu 22 installer at ${receipt.sourceCommit}: ${artifact.sha256}`)
          NODE
      - name: Extract the same deb for Ubuntu 24 acceptance
        shell: bash
        working-directory: apps/dsh-desktop/dist
        run: |
          set -Eeuo pipefail
          check='initialize installed-package acceptance'
          trap 'status=$?; printf "::error::Ubuntu 24 check=%s line=%s status=%s command=%s\n" "$check" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          checkpoint() { check=$1; printf '[ubuntu24] %s\n' "$check"; }
          mkdir -p linux-ubuntu24-qa
          checkpoint 'inspect and extract the same verified deb'
          version="$(node -p "require('../package.json').version")"
          deb="DeepSeek-Harness-Desktop-${version}-amd64.deb"
          dpkg-deb --info "$deb" >/dev/null
          inspection="$(mktemp -d "$RUNNER_TEMP/dsh-deb-ubuntu24.XXXXXX")"
          dpkg-deb --extract "$deb" "$inspection"
          mapfile -d '' executables < <(find "$inspection" -type f -name deepseek-harness-desktop -print0)
          checkpoint 'unique extracted executable'
          printf 'Extracted executable count=%s\n' "${#executables[@]}"
          test "${#executables[@]}" = 1
          test -x "${executables[0]}"
          # Extraction alone never runs the packaged postinst: Ubuntu 24 needs
          # its exact-path AppArmor userns profile. Install the same verified
          # DEB and exercise its real /opt path, including the product spaces.
          package="$(dpkg-deb --field "$deb" Package)"
          checkpoint 'install the same verified deb and run its real postinst'
          sudo apt-get install -y --no-install-recommends "./$deb"
          checkpoint 'verify dpkg reports fully installed'
          test "$(dpkg-query -W -f='${Status}' "$package")" = 'install ok installed'
          checkpoint 'classify installed package paths without following aliases'
          dpkg-query -L "$package" > linux-ubuntu24-qa/installed-files.txt
          node --input-type=module - linux-ubuntu24-qa/installed-files.txt <<'NODE' > linux-ubuntu24-qa/installed-executables.txt
          import assert from 'node:assert/strict'
          import { accessSync, constants, lstatSync, readFileSync } from 'node:fs'
          const selected = []
          for (const path of readFileSync(process.argv[2], 'utf8').split(/\r?\n/u)) {
            if (!path.endsWith('/deepseek-harness-desktop')) continue
            const info = lstatSync(path)
            const regular = info.isFile() && !info.isSymbolicLink()
            let executable = false
            if (regular) { try { accessSync(path, constants.X_OK); executable = true } catch {} }
            console.error(JSON.stringify({ check: 'installed-executable-candidate', path,
              kind: info.isSymbolicLink() ? 'symbolic-link' : info.isDirectory() ? 'directory' : 'file', regular, executable }))
            if (regular && executable) selected.push(path)
          }
          assert.equal(selected.length, 1, `Expected exactly one installed regular non-link executable; found ${selected.length}: ${JSON.stringify(selected)}`)
          console.log(selected[0])
          NODE
          mapfile -t installedExecutables < linux-ubuntu24-qa/installed-executables.txt
          checkpoint 'unique installed regular non-link executable'
          printf 'Installed executable count=%s paths=%s\n' "${#installedExecutables[@]}" "${installedExecutables[*]}"
          test "${#installedExecutables[@]}" = 1
          test -f "${installedExecutables[0]}"
          test ! -L "${installedExecutables[0]}"
          test -x "${installedExecutables[0]}"
          checkpoint 'compare installed ELF with the same extracted deb'
          cmp "${executables[0]}" "${installedExecutables[0]}"
          checkpoint 'actual installed product path with spaces'
          app="$(dirname "${installedExecutables[0]}")"
          printf 'Installed application directory=%s\n' "$app"
          test "$app" = '/opt/DeepSeek Harness Desktop'
          checkpoint 'bundled AppArmor bytes match the extracted installer'
          cmp "$(dirname "${executables[0]}")/resources/apparmor-profile" "$app/resources/apparmor-profile"
          checkpoint 'postinst deployed the same AppArmor profile'
          sudo cmp "$app/resources/apparmor-profile" /etc/apparmor.d/deepseek-harness-desktop
          checkpoint 'AppArmor attachment uses the actual installed executable'
          grep -F "\"${installedExecutables[0]}\"" "$app/resources/apparmor-profile"
          checkpoint 'AppArmor enforcement service is enabled'
          sudo apparmor_status --enabled
          checkpoint 'loaded exact AppArmor profile'
          sudo grep -Fx 'deepseek-harness-desktop (unconfined)' /sys/kernel/security/apparmor/profiles | tee linux-ubuntu24-qa/loaded-apparmor-profile.txt
          checkpoint 'installed application archive and deb identity'
          test -f "$app/resources/app.asar"
          test "$(cat "$app/resources/package-type")" = deb
          checkpoint 'link only the installed product into the existing verifier path'
          ln -s "$app" linux-unpacked
          printf '[ubuntu24] installed-package acceptance passed\n'
      - name: Verify the downloaded packaged runtime on Ubuntu 24
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "::error::Ubuntu 24 packaged-runtime line=%s status=%s command=%s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          printf '[ubuntu24] verify the real installed packaged runtime\n'
          pnpm --filter @linxin666/dsh-desktop pack:verify:linux | tee apps/dsh-desktop/dist/linux-ubuntu24-qa/package.log
      - name: Verify the same bundled Office engines on Ubuntu 24
        run: node apps/dsh-desktop/scripts/verify-office-runtime.mjs --resources apps/dsh-desktop/dist/linux-unpacked/resources --output apps/dsh-desktop/dist/linux-ubuntu24-qa/office-runtime-verification
      - name: Verify the downloaded Landlock engine on Ubuntu 24
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "::error::Ubuntu 24 Landlock line=%s status=%s command=%s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          printf '[ubuntu24] verify the installed Landlock engine\n'
          pnpm --filter @linxin666/dsh-desktop pack:sandbox:linux | tee apps/dsh-desktop/dist/linux-ubuntu24-qa/sandbox.log
      - name: Run the downloaded Electron under Ubuntu 24 Xvfb
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "::error::Ubuntu 24 sandbox-smoke line=%s status=%s command=%s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          sandbox=apps/dsh-desktop/dist/linux-unpacked/chrome-sandbox
          printf '[ubuntu24] set and verify installed sandbox ownership/mode: %s\n' "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          printf 'Installed sandbox ownership/mode=%s\n' "$(stat -c '%U:%G %a' "$sandbox")"
          test "$(stat -c '%U:%G %a' "$sandbox")" = 'root:root 4755'
          printf '[ubuntu24] launch the installed application under native Xvfb with its sandbox enabled\n'
          xvfb-run -a pnpm --filter @linxin666/dsh-desktop pack:smoke:linux | tee apps/dsh-desktop/dist/linux-ubuntu24-qa/smoke.log
      - name: Record Ubuntu 24 acceptance for the shared installer
        shell: bash
        working-directory: apps/dsh-desktop/dist
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFile, writeFile } from 'node:fs/promises'
          const receipt = JSON.parse(await readFile('distribution-artifacts-linux-x64.json', 'utf8'))
          assert.equal(receipt.sourceCommit, process.env.GITHUB_SHA)
          await writeFile('linux-ubuntu24-qa/result.json', JSON.stringify({
            schemaVersion: 1, status: 'passed', sourceCommit: receipt.sourceCommit,
            runner: 'ubuntu-24.04', installer: receipt.files[0],
            checks: ['native-deb-install-postinst', 'AppArmor-userns-profile-loaded', 'packaged-runtime', 'Office-preview-conversion-recalculation', 'Landlock', 'sandbox-enabled-Xvfb-startup'],
          }, null, 2) + '\n')
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeepSeek-Harness-Desktop-linux-x64-ubuntu24-qa
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/dsh-desktop/dist/linux-ubuntu24-qa/**
            apps/dsh-desktop/dist/SHA256SUMS-linux.txt
            apps/dsh-desktop/dist/distribution-artifacts-linux-x64.json
