name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deepseek-ai/dsh-desktop exec playwright install chromium
      - run: pnpm --filter @deepseek-ai/dsh-desktop test:window-chrome:e2e
      - run: pnpm --filter @deepseek-ai/dsh-desktop test:directory-picker:e2e
      - run: pnpm --filter @deepseek-ai/dsh-desktop test:runtime-provider:e2e
      - run: pnpm --filter @deepseek-ai/dsh-desktop test:preset-deep-link:e2e
      - name: Verify direct-start and deterministic repair integration
        run: pnpm --filter @deepseek-ai/dsh-desktop exec node --test test/packaged-direct-start-matrix.test.mjs test/repair-agent-integration.test.mjs test/session-preservation.test.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm runtime-deps:check
      - run: pnpm dsh-imports:check
      - run: pnpm dsh-audit:check
      - run: pnpm runtime-support:check
      - run: pnpm runtime-support-matrix:check
      - run: pnpm community-plugin-quality:check
      - run: pnpm sync-shared:check
      - run: pnpm release:notes:check
      - run: pnpm website:check
      - run: pnpm aggregate:check
      - run: pnpm gallery:check
      - run: pnpm skin-center:check
      - run: pnpm community:check
      - run: pnpm docs:check
      - run: git diff --check
