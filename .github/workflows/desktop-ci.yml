name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Fetch desktop release tags for the version floor check
        run: git fetch --tags origin 'refs/tags/desktop-v*:refs/tags/desktop-v*'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enforce the desktop version release floor
        run: node scripts/verify-desktop-version-floor.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deepseek-ai/dsh-desktop exec playwright install chromium
      - name: Feature preservation baseline check
        run: pnpm feature-baseline:check
      - name: Desktop core regression E2E gate
        # Only the maintainer-approved 3.4.0 DPI position assertion is accepted.
        # The test still runs; every other failure and version stays blocking.
        run: pnpm desktop:regression:e2e --accept-known-dpi-position-3.4.0
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm runtime-deps:check
      - run: pnpm runtime-graph:check
      - run: pnpm dsh-imports:check
      - run: pnpm dsh-audit:check
      - run: pnpm runtime-support:check
      - run: pnpm runtime-support-matrix:check
      - run: pnpm community-plugin-quality:check
      - run: pnpm sync-shared:check
      - run: pnpm release:notes:check
      - run: pnpm website:check
      - run: pnpm aggregate:check
      - run: pnpm gallery:check
      - run: pnpm skin-center:check
      - run: pnpm community:check
      - run: pnpm docs:check
      - run: git diff --check
