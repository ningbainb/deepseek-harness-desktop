appId: com.ningbainb.deepseek-harness.desktop
productName: DeepSeek Harness Desktop
copyright: Copyright (c) 2026 ningbai牛逼 and DeepSeek Harness Desktop contributors

asar: true
asarUnpack:
  - node_modules/**
npmRebuild: false
compression: normal
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
afterPack: scripts/after-pack.cjs

extraResources:
  - from: build/icon.png
    to: app-icon.png
  - from: build/telemetry-config.json
    to: telemetry-config.json
  - from: build/update-shutdown-v1
    to: update-shutdown-v1
  - from: build/update-shutdown-v2
    to: update-shutdown-v2
  - from: build/installer-upgrade-v3
    to: installer-upgrade-v3
  - from: runtime-support/supported-runtimes.json
    to: runtime-support/supported-runtimes.json
  - from: runtime-support/known-good.json
    to: runtime-support/known-good.json
  - from: runtime-support/desktop-pipe.patch.yml
    to: runtime-support/desktop-pipe.patch.yml

directories:
  output: dist
  buildResources: build

files:
  - src/**
  - runtime-support/community-plugin-known-issues.json
  - package.json
  - '!**/*.map'
  - '!**/test/**'

win:
  icon: build/icon.ico
  extraResources:
    - from: build/bundled-managed-git/managed-git/current
      to: managed-git/current
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  # Certificates are supplied only through the release environment. `REQUIRE_SIGNING`
  # is checked by the release scripts so unsigned developer builds remain usable.
  signAndEditExecutable: true
  verifyUpdateCodeSignature: true

nsis:
  # Fixed community-owned identity. The legacy GUID is migrated by installer.nsh.
  guid: 88abe781-9bbf-5b27-9200-c24696774d39
  include: build/installer.nsh
  artifactName: DeepSeek-Harness-Desktop-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  packElevateHelper: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness Desktop

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Unsigned contributor preview: skip signing instead of ad-hoc or Developer ID.
  # G1 / stage 3 will replace identity: null after a real certificate exists.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  forceCodeSigning: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  minimumSystemVersion: '11.0'
  darkModeSupport: true
  artifactName: DeepSeek-Harness-Desktop-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  artifactName: DeepSeek-Harness-Desktop-${version}-${arch}.${ext}
  title: DeepSeek Harness Desktop ${version}

linux:
  icon: build/icon.png
  category: Development
  maintainer: ningbainb <ningbainb@users.noreply.github.com>
  vendor: ningbainb
  executableName: deepseek-harness-desktop
  synopsis: AI coding desktop workspace
  description: DeepSeek Harness Desktop integrates AI conversations, project files, Git, skills and automation in one workspace.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: DeepSeek-Harness-Desktop-${version}-x86_64.${ext}

deb:
  artifactName: DeepSeek-Harness-Desktop-${version}-amd64.${ext}
  packageCategory: devel
  priority: optional

publish:
  provider: github
  owner: ningbainb
  repo: deepseek-harness-desktop

protocols:
  - name: DeepSeek Harness Desktop
    schemes:
      - dsh-community

fileAssociations:
  - ext: dshpreset
    name: DeepSeek Harness Desktop Preset
    description: Reviewable DeepSeek Harness Desktop environment preset
    icon: build/icon.ico
    role: Editor
