<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
    <title>DeepSeek Harness Desktop</title>
    <link rel="stylesheet" href="./startup.css">
  </head>
  <body>
    <main class="launch-screen">
      <div class="atmosphere" aria-hidden="true">
        <canvas id="whale-canvas"></canvas>
        <span class="deep-glow"></span>
        <span class="grain"></span>
      </div>

      <header class="brand" aria-label="DeepSeek Harness Desktop">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <span>DeepSeek Harness</span>
        <span class="brand-edition">Desktop</span>
      </header>

      <section class="hero">
        <p class="eyebrow">LOCAL INTELLIGENCE / DESKTOP</p>
        <h1>探索未至之境</h1>

        <div class="launch-status">
          <div class="status-line">
            <span id="status-title" aria-live="polite" aria-atomic="true">正在准备本地环境</span>
            <output id="progress-value" for="startup-progress">08%</output>
          </div>
          <div class="meter" id="startup-progress" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8">
            <span class="meter-fill" id="meter-fill"><i></i></span>
          </div>
          <p class="status-detail" id="status-detail">完整 Harness 正在本地启动</p>
        </div>

        <pre id="error-log" hidden></pre>
        <div class="actions" id="actions" hidden>
          <button type="button" data-action="retry">重新尝试</button>
          <button type="button" data-action="repair">修复 Profile</button>
          <button type="button" class="quiet" data-action="open-logs">打开日志</button>
          <button type="button" class="quiet" data-action="exit">退出</button>
        </div>
      </section>

      <footer id="version">DESKTOP</footer>
    </main>
    <script type="module" src="./startup.mjs"></script>
  </body>
</html>
