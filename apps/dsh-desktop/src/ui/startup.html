<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
    <title>DeepSeek Harness Desktop</title>
    <link rel="stylesheet" href="./startup.css">
  </head>
  <body>
    <main class="launch-screen">
      <div class="atmosphere" aria-hidden="true">
        <canvas id="whale-canvas"></canvas>
        <span class="deep-glow"></span>
        <span class="grain"></span>
      </div>

      <header class="brand" aria-label="DeepSeek Harness Desktop">
        <span>DeepSeek Harness</span>
        <span class="brand-edition">Desktop</span>
      </header>

      <section class="hero">
        <h1>探索未至之境</h1>
        <p class="hero-sub">Explore the Uncharted</p>

        <div class="launch-status">
          <div class="status-line">
            <span id="status-title" aria-live="polite" aria-atomic="true">正在准备本地环境</span>
            <output id="progress-value" for="startup-progress">08%</output>
          </div>
          <div class="meter" id="startup-progress" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8" data-phase="0">
            <span class="meter-tick meter-tick-1" style="left: 34%" aria-hidden="true"></span>
            <span class="meter-tick meter-tick-2" style="left: 72%" aria-hidden="true"></span>
            <span class="meter-fill" id="meter-fill"><i></i></span>
            <span class="meter-tip" aria-hidden="true"></span>
          </div>
          <p class="status-detail" id="status-detail">完整 Harness 正在本地启动</p>
          <div class="startup-support">
            <button type="button" class="quiet" data-tool-action="terminal">打开内置终端</button>
            <button type="button" class="quiet" data-action="export-diagnostics" aria-describedby="diagnostic-export-status">导出诊断日志</button>
            <p class="startup-support-hint">升级迁移会在后台自动完成；启动卡住时仍可打开内置终端，或导出已脱敏的诊断日志。</p>
          </div>
          <p class="diagnostic-export-status" id="diagnostic-export-status" role="status" aria-live="polite" hidden></p>
        </div>

        <section class="recovery-summary" id="recovery-summary" hidden>
          <h2 id="recovery-title">检测到插件导致启动失败</h2>
          <p id="recovery-reason"></p>
          <p class="data-safety">停用插件不会删除聊天记录、模型设置、账号信息和个人配置。</p>
        </section>
        <pre id="error-log" hidden></pre>
        <div class="actions" id="actions" hidden>
          <button type="button" id="disable-plugin" data-action="disable-plugin" hidden>一键停用并重启</button>
          <button type="button" id="safe-mode" data-action="safe-mode">进入安全模式</button>
          <button type="button" id="retry" data-action="retry">重新尝试</button>
          <button type="button" id="repair" data-action="repair">修复 Profile</button>
          <button type="button" class="quiet" id="technical-details">查看技术详情</button>
          <button type="button" class="quiet" data-action="open-logs">打开日志</button>
          <button type="button" class="quiet" data-action="exit">退出</button>
        </div>
      </section>

      <footer id="version">DESKTOP</footer>
    </main>
    <script type="module" src="./startup.mjs"></script>
  </body>
</html>
