<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
    <title>DeepSeek Harness Desktop</title>
    <link rel="stylesheet" href="./startup.css">
  </head>
  <body>
    <main class="launch-screen">
      <div class="atmosphere" aria-hidden="true">
        <canvas id="whale-canvas"></canvas>
        <span class="deep-glow"></span>
        <span class="grain"></span>
      </div>

      <header class="brand" aria-label="DeepSeek Harness Desktop">
        <span>DeepSeek Harness</span>
        <span class="brand-edition">Desktop</span>
      </header>

      <section class="hero">
        <h1>探索未至之境</h1>
        <p class="hero-sub">Explore the Uncharted</p>

        <div class="launch-status">
          <div class="status-line">
            <span id="status-title" aria-live="polite" aria-atomic="true">正在准备本地环境</span>
            <output id="progress-value" for="startup-progress">08%</output>
          </div>
          <div class="meter" id="startup-progress" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8" data-phase="0">
            <span class="meter-tick meter-tick-1" style="left: 34%" aria-hidden="true"></span>
            <span class="meter-tick meter-tick-2" style="left: 72%" aria-hidden="true"></span>
            <span class="meter-fill" id="meter-fill"><i></i></span>
            <span class="meter-tip" aria-hidden="true"></span>
          </div>
          <p class="status-detail" id="status-detail">正在读取原有数据</p>
          <p class="status-ticker" id="status-ticker" aria-live="polite" hidden></p>
          <ol id="startup-steps" class="startup-steps" aria-label="启动与自动修复过程" hidden>
            <li data-startup-step="full">尝试启动全部插件</li>
            <li data-startup-step="retry">自动重试完整启动</li>
            <li data-startup-step="repair">调用已配置模型进行安全修复</li>
            <li data-startup-step="verify">验证候选修复</li>
            <li data-startup-step="fallback">使用内置插件继续启动</li>
          </ol>
          <p id="startup-guidance" class="startup-guidance" hidden></p>
        </div>
      </section>

      <footer id="version">DESKTOP</footer>
    </main>
    <script type="module" src="./startup.mjs"></script>
  </body>
</html>
