<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
    <title>DeepSeek Harness Desktop 修复</title>
    <link rel="stylesheet" href="./recovery.css">
  </head>
  <body>
    <main class="recovery-shell">
      <p class="eyebrow">DeepSeek Harness Desktop</p>
      <h1>本地修复界面已就绪</h1>
      <p class="lead">完整运行时暂时无法启动，但你仍可以留在 Desktop 中查看恢复选项。</p>

      <section class="status-card" aria-labelledby="recovery-summary-title">
        <h2 id="recovery-summary-title">正在检查启动状态</h2>
        <p id="recovery-summary" aria-live="polite">正在读取本地恢复信息。</p>
        <p class="incident" id="recovery-incident" hidden></p>
      </section>

      <div class="actions" aria-label="恢复操作">
        <button type="button" data-action="continue-migration" hidden>继续迁移</button>
        <button type="button" class="secondary" data-action="rollback-migration" hidden>回滚迁移</button>
        <button type="button" data-action="enter-free-mode" hidden>启动隔离恢复会话（当前用户完整权限）</button>
        <button type="button" class="quiet" data-action="revoke-external-plugin-trust" hidden>撤销主 Runtime 和外来插件完整权限授权</button>
        <button type="button" class="secondary full-access" data-action="clone-existing-profile" hidden>复制当前配置和插件后进入隔离恢复会话</button>
        <button type="button" class="secondary full-access" data-action="choose-external-plugin" hidden>选择本地目录、链接或 .tgz 并在隔离恢复会话中启动</button>
        <button type="button" data-action="install-managed-git" hidden>安装 Desktop 管理的 Git</button>
        <button type="button" data-action="retry">重新尝试启动</button>
        <button type="button" class="secondary" data-action="open-logs">打开日志文件夹</button>
        <button type="button" class="quiet" data-action="exit">退出</button>
      </div>
      <section class="external-plugin-source" id="external-plugin-source" aria-labelledby="external-plugin-source-title" hidden>
        <h2 id="external-plugin-source-title">加载外来插件来源</h2>
        <p>可输入 npm 包、Git 或 HTTPS 来源；本地 file、link、workspace 目录请用上方系统选择器。Desktop 会在下一步显示本机确认，并只在隔离恢复会话中加载。</p>
        <div class="external-plugin-source-controls">
          <label class="sr-only" for="external-plugin-source-input">npm、Git 或 HTTPS 插件来源；本地来源使用系统选择器</label>
          <input id="external-plugin-source-input" type="text" maxlength="2048" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例如：@scope/plugin、github:owner/plugin 或 https://…">
          <button type="button" class="secondary full-access" data-action="load-external-plugin-source">在隔离恢复会话中加载此来源</button>
        </div>
      </section>
      <p class="action-status" id="action-status" role="status" aria-live="polite" hidden></p>

      <p class="privacy-note">此页面不会显示错误原文、文件路径、命令或个人内容。若需要反馈，请先导出或打开本地日志。</p>
    </main>
    <script type="module" src="./recovery.mjs"></script>
  </body>
</html>
